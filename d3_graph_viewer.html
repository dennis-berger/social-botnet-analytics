<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D3.js Social Graph Demo (Advanced)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #f5f5f7; }
    .link { stroke: #bbb; stroke-width: 1.2px; }
    .node { stroke: #222; stroke-width: 1.5px; }
    .node.bot { stroke: #f00; stroke-width: 2.5px; }
    .legend { font-size: 14px; }
    .tooltip {
      position: absolute;
      text-align: center;
      padding: 7px;
      background: rgba(0,0,0,0.9);
      color: #fff;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      visibility: hidden;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h2>D3.js Social Graph Visualization</h2>
  <svg width="960" height="600"></svg>
  <div class="tooltip" id="tooltip"></div>
  <div id="legend"></div>
  <script>
    const width = 960, height = 600;
    const svg = d3.select("svg");
    const tooltip = d3.select("#tooltip");

    // Load data and draw graph
    d3.json("d3_graph.json").then(graph => {
      // Compute node degree for size
      const nodeDegrees = {};
      graph.links.forEach(link => {
        nodeDegrees[link.source] = (nodeDegrees[link.source] || 0) + 1;
        nodeDegrees[link.target] = (nodeDegrees[link.target] || 0) + 1;
      });

      // Setup color scale
      const color = d3.scaleOrdinal().domain([0, 1]).range(["#41b349", "#e33d3d"]);

      // Zoom and pan
      const zoom = d3.zoom()
        .scaleExtent([0.1, 3])
        .on("zoom", (event) => g.attr("transform", event.transform));
      svg.call(zoom);

      // Main group
      const g = svg.append("g");

      // Draw links
      const link = g.append("g")
        .attr("stroke", "#bbb")
        .attr("stroke-opacity", 0.6)
        .selectAll("line")
        .data(graph.links)
        .join("line")
        .attr("class", "link");

      // Draw nodes
      const node = g.append("g")
        .selectAll("circle")
        .data(graph.nodes)
        .join("circle")
        .attr("class", d => "node" + (d.group === 1 ? " bot" : ""))
        .attr("r", d => 5 + Math.sqrt(nodeDegrees[d.id] || 1))
        .attr("fill", d => color(d.group))
        .attr("stroke", d => d.group === 1 ? "#d60000" : "#222")
        .attr("stroke-width", d => d.group === 1 ? 2.5 : 1.5)
        .call(drag(simulation))
        .on("mouseover", (event, d) => {
          // Highlight
          node.style("opacity", o => (isNeighbor(d, o) ? 1 : 0.2));
          link.style("stroke-opacity", l => (l.source.id === d.id || l.target.id === d.id) ? 0.85 : 0.15);
          tooltip
            .style("visibility", "visible")
            .html(
              `<b>${d.label}</b><br>` +
              `Type: ${d.group === 1 ? "Bot" : "Human"}<br>` +
              `Degree: ${nodeDegrees[d.id] || 0}`
            )
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 15) + "px");
        })
        .on("mousemove", (event) => {
          tooltip
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 15) + "px");
        })
        .on("mouseout", () => {
          node.style("opacity", 1);
          link.style("stroke-opacity", 0.6);
          tooltip.style("visibility", "hidden");
        });

      // D3 simulation (force-directed layout)
      const simulation = d3.forceSimulation(graph.nodes)
        .force("link", d3.forceLink(graph.links).id(d => d.id).distance(70))
        .force("charge", d3.forceManyBody().strength(-180))
        .force("center", d3.forceCenter(width / 2, height / 2));

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);
        node
          .attr("cx", d => d.x)
          .attr("cy", d => d.y);
      });

      function drag(simulation) {
        return d3.drag()
          .on("start", (event) => {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
          })
          .on("drag", (event) => {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
          })
          .on("end", (event) => {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
          });
      }

      // Helper for highlighting neighbors
      function isNeighbor(a, b) {
        return a.id === b.id ||
          graph.links.some(l => (l.source.id === a.id && l.target.id === b.id) || (l.source.id === b.id && l.target.id === a.id));
      }

      // Legend
      const legendHtml = `
        <span class="legend" style="color:#41b349;"><svg height="12" width="12"><circle cx="6" cy="6" r="6" fill="#41b349" stroke="#222" stroke-width="1"/></svg> Human</span>
        <span class="legend" style="margin-left:30px; color:#e33d3d;"><svg height="12" width="12"><circle cx="6" cy="6" r="6" fill="#e33d3d" stroke="#d60000" stroke-width="2.5"/></svg> Bot</span>
      `;
      d3.select("#legend").html(legendHtml);

    });
  </script>
</body>
</html>
